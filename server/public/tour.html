<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogForge Guided Tour</title>
<style>
:root{
  color-scheme:dark;
  --bg:#06080f; --panel:#0d121d; --panel2:#131a29; --line:#1c2538; --text:#e8ecf5; --muted:#8793ab;
  --accent:#7c9cff; --teal:#4fd1c5; --info:#5aa9ff; --warn:#f5b84a; --bad:#ff6b6b; --ok:#46d39a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0}
body{font:15px/1.5 var(--sans);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 520px at 12% -8%,rgba(124,156,255,.14),transparent 60%),radial-gradient(900px 480px at 92% -4%,rgba(79,209,197,.11),transparent 60%),var(--bg)}
header{display:flex;align-items:center;gap:18px;padding:14px 28px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;display:flex;gap:9px;align-items:center;letter-spacing:-.02em}
.logo i{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--teal));box-shadow:0 0 14px rgba(79,209,197,.6)}
.tag{font:11px var(--mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.dots{display:flex;gap:7px;margin:0 auto}
.dots button{width:30px;height:6px;border-radius:99px;border:0;padding:0;background:#1a2336;cursor:pointer;transition:.25s}
.dots button.seen{background:#34456e} .dots button.on{background:var(--teal);width:58px;box-shadow:0 0 12px rgba(79,209,197,.6)}
.links{display:flex;gap:16px;align-items:center;font-size:13px}
.links a{color:var(--muted);text-decoration:none;transition:.15s} .links a:hover{color:var(--text)}
.links label{color:var(--muted);display:flex;gap:7px;align-items:center;cursor:pointer;user-select:none}
main{max-width:1320px;margin:0 auto;padding:6px 28px 48px;display:grid;gap:18px}

/* stage */
.stage{border:1px solid #1a2339;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#080d18,#050811);box-shadow:0 30px 80px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.04)}
canvas{display:block;width:100%}
.stagebar{display:grid;grid-template-columns:minmax(300px,5fr) 7fr;border-top:1px solid #151d30}
@media(max-width:900px){.stagebar{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#151d30}
.kpi{background:#070b14;padding:14px 16px}
.kpi .v{font:700 26px var(--mono);letter-spacing:-.03em;line-height:1.1}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-top:3px}
.kpi.t .v{color:var(--teal)}
.term{background:#04070d;border-left:1px solid #151d30;padding:10px 14px;height:104px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;font:11.5px/1.55 var(--mono);position:relative}
.term .hd{position:absolute;top:8px;right:14px;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.term .hd i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:6px}
.term .hd i.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tl{display:flex;gap:10px;white-space:nowrap;animation:tin .25s ease both}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tl .tt{color:#56627a}.tl .ts{color:var(--teal);min-width:92px}.tl .tm{color:#c4cde0;overflow:hidden;text-overflow:ellipsis}
.tl .tv{min-width:42px;font-weight:700;text-transform:uppercase}
.tv.info{color:var(--info)}.tv.warn{color:var(--warn)}.tv.error{color:var(--bad)}

/* story */
.grid{display:grid;grid-template-columns:5fr 7fr;gap:18px}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),#0a0f19);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0;position:relative;overflow:hidden}
.narr::before{content:attr(data-n);position:absolute;right:14px;top:-18px;font:900 150px/1 var(--sans);color:rgba(124,156,255,.06);letter-spacing:-.06em;pointer-events:none}
.kicker{font:600 12px var(--mono);color:var(--teal);letter-spacing:.14em;text-transform:uppercase}
h1{font-size:34px;line-height:1.1;margin:8px 0 14px;letter-spacing:-.03em;background:linear-gradient(135deg,#fff,#a9b8ff 60%,#7fe3d8);-webkit-background-clip:text;background-clip:text;color:transparent}
.narr p{margin:0 0 11px;font-size:16px;color:#d5dbea}
.narr p.dim{color:var(--muted);font-size:14px}
.nav{display:flex;gap:10px;margin-top:20px;align-items:center}
.swap{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
button,input{font:inherit;color:var(--text)}
button.btn{background:var(--panel2);border:1px solid #243049;border-radius:10px;padding:10px 18px;cursor:pointer;transition:.15s}
button.btn:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)} button.btn:disabled{opacity:.4;cursor:not-allowed}
button.go{background:linear-gradient(135deg,#7c9cff,#5470f0);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 8px 24px -8px rgba(92,120,255,.7)}
button.stop{border-color:var(--bad);color:var(--bad)}
.hint{font-size:12px;color:var(--muted)}
input[type=text]{background:var(--panel2);border:1px solid #243049;border-radius:9px;padding:9px 12px;outline:none;width:100%}
input[type=text]:focus{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--teal)}
.big{font:800 46px var(--mono);letter-spacing:-.04em;background:linear-gradient(135deg,var(--teal),#8fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.stat{background:var(--panel2);border:1px solid #1f2a42;border-radius:12px;padding:12px 16px;min-width:130px}
.stat .v{font:700 24px var(--mono);letter-spacing:-.02em} .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.track{background:#0a0f1a;border:1px solid #18213a;border-radius:8px;height:26px;overflow:hidden}
.fill{height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#5470f0,var(--teal));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fill.slow{background:linear-gradient(90deg,#b8434f,var(--bad))} .fill.mid{background:linear-gradient(90deg,#3a4764,#66738f)}
.bar{display:grid;grid-template-columns:210px 1fr 150px;gap:12px;align-items:center;font:12px var(--mono);margin:9px 0}
pre{margin:0;background:#080c15;border:1px solid #18213a;border-radius:10px;padding:12px;font:12px/1.5 var(--mono);overflow:auto;max-height:190px;white-space:pre-wrap;word-break:break-all;color:#c4cde0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.mini{background:var(--panel2);border:1px solid #1f2a42;border-radius:14px;padding:14px;transition:.2s}
.mini:hover{border-color:#3a4c7a;transform:translateY(-2px)}
.mini .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:8px;font:700 14px var(--mono);background:linear-gradient(135deg,rgba(124,156,255,.25),rgba(79,209,197,.2));color:var(--teal)}
.mini b{display:block;margin-bottom:3px;font-size:14px}.mini span{font-size:12.5px;color:var(--muted);line-height:1.45;display:block}
.ctl{display:grid;grid-template-columns:170px 1fr 70px;gap:12px;align-items:center;margin:10px 0;font-size:13px}
.ctl output{font:13px var(--mono);text-align:right;color:var(--teal)}
code{font-family:var(--mono);background:#131b2d;padding:1px 7px;border-radius:6px;font-size:13px;color:#b9c6ef}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>LogForge <span class="tag">guided tour</span></div>
  <div class="dots" id="dots"></div>
  <div class="links">
    <label><input type="checkbox" id="slow"> slow motion</label>
    <a href="/">Open live console →</a>
  </div>
</header>

<main>
  <section class="stage">
    <canvas id="pipe" data-h="410"></canvas>
    <div class="stagebar">
      <div class="kpis">
        <div class="kpi t"><div class="v" id="nLps">0</div><div class="l">logs / sec</div></div>
        <div class="kpi"><div class="v" id="nRps">0</div><div class="l">requests / sec</div></div>
        <div class="kpi"><div class="v" id="nP95">–</div><div class="l">p95 latency</div></div>
        <div class="kpi"><div class="v" id="nShed">0</div><div class="l">shed (503)</div></div>
      </div>
      <div class="term" id="term"><div class="hd"><i id="termDot"></i>live tail · SSE</div></div>
    </div>
  </section>

  <div class="grid">
    <section class="card narr" id="narr">
      <div class="kicker" id="kicker"></div>
      <h1 id="title"></h1>
      <div id="text"></div>
      <div class="nav">
        <button class="btn" id="prev">← Back</button>
        <button class="btn go" id="next">Next →</button>
        <span class="hint">arrow keys work too</span>
      </div>
    </section>
    <section class="card" id="panel"></section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e4 ? (n/1e3).toFixed(1)+'k' : Math.round(n).toLocaleString();
const rnd = (n) => Math.floor(Math.random()*n);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const pct = (a,p) => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); return s[Math.min(s.length-1, Math.floor(s.length*p))]; };
const P = {teal:'#4fd1c5', info:'#5aa9ff', warn:'#f5b84a', error:'#ff6b6b', bad:'#ff6b6b', ink:'#e8ecf5', mute:'#7d889f', dim:'#1b2438', accent:'#7c9cff'};
const rr = (ctx,x,y,w,h,r) => { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };

// DPR-safe canvas sizing. The logical height lives in data-h; reading the `height` attribute we
// overwrite here made canvases grow on every redraw in an earlier version.
function fit(cv){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = +cv.dataset.h;
  cv.style.height = h + 'px';
  const bw = Math.round(w*dpr), bh = Math.round(h*dpr);
  if(cv.width !== bw || cv.height !== bh){ cv.width = bw; cv.height = bh; }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  return {ctx,w,h};
}

const SERVICES = ['auth','payments','gateway','orders','search','notifications','inventory'];
const MSGS = [r=>`Request ${r} completed`, r=>`Cache miss for key user:${r}`, r=>`Upstream timeout after ${r%900+100}ms`, r=>`Payment ${r} authorized`,
  r=>`Retrying job ${r} (attempt ${r%4+1})`, r=>`Connection pool saturated (${r%50} waiting)`, r=>`User ${r} logged in`, r=>`Slow query detected: ${r%2000+300}ms`,
  r=>`Webhook ${r} delivered`, r=>`Disk usage at ${r%30+70}%`];
function genLog(){ const r = rnd(1e6), p = Math.random();
  return {service:SERVICES[rnd(SERVICES.length)], level:p<.7?'info':p<.92?'warn':'error', message:MSGS[rnd(MSGS.length)](r),
    metadata:{requestId:r.toString(36), latencyMs:rnd(900), region:['us-east','eu-west','ap-south'][rnd(3)]}}; }

/* ================= server vitals ================= */
let vit = null, totalRows = 0, rowsShown = 0;
async function pollVitals(){ try{ vit = await (await fetch('/api/metrics')).json(); }catch{} }
async function pollRows(){ try{ totalRows = (await (await fetch('/api/logs/stats?window=10&bucket=5')).json()).totalRows ?? totalRows; }catch{} }
setInterval(pollVitals, 500); pollVitals(); setInterval(pollRows, 2000); pollRows();

/* ================= live tail (real SSE) ================= */
const term = $('term');
function termLine(r){
  const d = document.createElement('div'); d.className = 'tl';
  d.innerHTML = `<span class="tt">${new Date(r.timestamp).toLocaleTimeString([], {hour12:false})}</span><span class="tv ${r.level}">${r.level}</span><span class="ts">${esc(r.service)}</span><span class="tm">${esc(r.message)}</span>`;
  term.appendChild(d); while(term.querySelectorAll('.tl').length > 5) term.querySelector('.tl').remove();
}
const es = new EventSource('/api/logs/stream');
es.onopen = () => $('termDot').classList.add('on'); es.onerror = () => $('termDot').classList.remove('on');
es.addEventListener('logs', (e) => JSON.parse(e.data).rows.slice(-3).forEach(termLine));

/* ================= stage renderer ================= */
const S = ['limit','bp','val','gate'];
const GATE = {limit:'Rate limiter', bp:'Backpressure', val:'Validation', gate:'DB gate'};
const REJECT_AT = {limited:'limit', shed:'bp', invalid:'val', error:'gate'};
const OUT_COLOR = {limited:P.warn, shed:P.bad, invalid:P.warn, error:P.bad};
const packets = [], shards = [], acks = [], pulses = [];
const flash = {limit:0, bp:0, val:0, gate:0, db:0}, flashCol = {limit:P.teal, bp:P.teal, val:P.teal, gate:P.teal, db:P.teal};
const chips = [{name:'auth', f:0}, {name:'payments', f:0}, {name:'gateway', f:0}];
let G = null, spawnTimes = [];
const slowF = () => $('slow').checked ? .25 : 1;

function geo(w,h){
  const laneY = 170, dbW = Math.min(112, w*.09), dbX = w*.905;
  return {w, h, laneY, tubeH:100, x0:w*.16, gx:{limit:w*.29, bp:w*.43, val:w*.57, gate:w*.705}, dbX, dbW, dbL:dbX-dbW/2, cylH:156, retY:h-44, chipW:Math.min(94, w*.085), chipX:14};
}
G = geo(1200, 410);

const glow = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(79,209,197,.6)'); g.addColorStop(1,'rgba(79,209,197,0)'); x.fillStyle = g; x.fillRect(0,0,64,64); return c; })();
const sideOf = (n) => n === 1 ? 9 : Math.round(7 + 2.2*Math.pow(n,.45));
const sprites = new Map();
// A packet is one HTTP request. A single log is one dot; a batch is a block of tiny cells, one cell per log,
// coloured by level (blue info, amber warn, red error). That is the point of batching: one trip, many logs.
function sprite(n, level){
  const variant = n === 1 ? level : rnd(4), key = n+':'+variant;
  if(sprites.has(key)) return sprites.get(key);
  const side = sideOf(n), SC = 3, c = document.createElement('canvas'); c.width = c.height = side*SC; const x = c.getContext('2d'); x.scale(SC,SC);
  if(n === 1){
    x.fillStyle = P[level] || P.info; x.beginPath(); x.arc(side/2, side/2, side/2-.5, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,.6)'; x.beginPath(); x.arc(side/2-1.2, side/2-1.2, 1.5, 0, 7); x.fill();
  } else {
    x.fillStyle = 'rgba(7,12,22,.95)'; rr(x,.5,.5,side-1,side-1,Math.min(7,side/5)); x.fill(); x.strokeStyle = P.teal; x.lineWidth = 1.3; x.stroke();
    const inset = 3.5, cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n/cols), cw = (side-inset*2)/cols, ch = (side-inset*2)/rows, gap = cw > 2.6 ? .5 : .18;
    for(let i=0;i<n;i++){ const r = Math.random(); x.fillStyle = r < .7 ? P.info : r < .92 ? P.warn : P.error;
      x.fillRect(inset+(i%cols)*cw+gap, inset+Math.floor(i/cols)*ch+gap, cw-gap*2, ch-gap*2); }
  }
  sprites.set(key,c); return c;
}

function spawn(outcome, n, level){
  const now = performance.now(); spawnTimes.push(now); while(spawnTimes.length && now - spawnTimes[0] > 1000) spawnTimes.shift();
  const budget = n === 1 ? 36 : 12, rate = spawnTimes.length;
  if(rate > budget && Math.random() > budget/rate) return;              // sampled for readability; counters stay exact
  const side = sideOf(n), lane = side > 22 ? 0 : [-28,0,28][rnd(3)];
  if(packets.some(p => p.lane === lane && p.phase === 'in' && p.x < G.x0 + (p.side+side)/2 + 8)) return;  // keep the start clear
  const chip = rnd(3); chips[chip].f = 1;
  packets.push({x:G.x0, lane, side, n, outcome, spr:sprite(n,level), phase:'in', si:0, dwell:0, chip, a:0, queued:false});
}

function shardBurst(x, y, n, colors, vx0, vy0, spread){
  for(let i=0;i<n;i++) shards.push({x, y, vx:vx0+(Math.random()-.5)*spread, vy:vy0+(Math.random()-.5)*spread, life:1, col:colors[rnd(colors.length)], s:1.6+Math.random()*1.6});
}
const LV = [P.info, P.info, P.info, P.warn, P.error];

function ackPoint(u){
  const c = G.chipX + G.chipW/2, ys = [G.laneY-66, G.laneY, G.laneY+66];
  const pts = [[G.dbX, G.laneY+G.cylH/2+6], [G.dbX, G.retY], [G.chipX-8, G.retY], [G.chipX-8, ys[u.chip]], [G.chipX+2, ys[u.chip]]];
  let len = 0; const seg = []; for(let i=0;i<pts.length-1;i++){ const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); seg.push(d); len += d; }
  let d = u.u*len; for(let i=0;i<seg.length;i++){ if(d <= seg[i]){ const k = d/seg[i]; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*k, pts[i][1]+(pts[i+1][1]-pts[i][1])*k]; } d -= seg[i]; }
  return pts[pts.length-1];
}
const ackLen = () => 156/2+6 + (G.retY-(G.laneY+G.cylH/2+6)) + (G.dbX-(G.chipX-8)) + Math.abs(G.retY-G.laneY) + 10;

function drawCylinder(ctx, cx, cy, w, h, f){
  const ry = 13, x = cx-w/2, top = cy-h/2, bot = cy+h/2;
  const g = ctx.createLinearGradient(x,0,x+w,0); g.addColorStop(0,'#0f1a2e'); g.addColorStop(.5,'#18274a'); g.addColorStop(1,'#0c1627');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bot); ctx.ellipse(cx,bot,w/2,ry,0,Math.PI,0,true); ctx.lineTo(x+w,top); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = f > .05 ? P.teal : '#2a3a5e'; ctx.lineWidth = 1.5 + f*1.5; ctx.stroke();
  for(let i=1;i<=3;i++){ const yy = top + (h/4)*i; ctx.beginPath(); ctx.ellipse(cx,yy,w/2,ry,0,0,Math.PI); ctx.strokeStyle = 'rgba(124,156,255,.16)'; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.fillStyle = '#1a2a4d'; ctx.beginPath(); ctx.ellipse(cx,top,w/2,ry,0,0,7); ctx.fill(); ctx.strokeStyle = f > .05 ? P.teal : '#344a7a'; ctx.lineWidth = 1.5 + f*1.5; ctx.stroke();
  if(f > .05){ ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = f*.55; ctx.drawImage(glow, cx-w, cy-h*.7, w*2, h*1.4); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
}

let tPrev = performance.now();
function frame(now){
  const dt = Math.min((now-tPrev)/1000, .05); tPrev = now; const tsec = now/1000, F = slowF();
  const cv = $('pipe'), {ctx,w,h} = fit(cv); G = geo(w,h);
  const m = vit, pool = m?.pool, avgWait = m?.db?.avgWaitMs || 0, avgQ = m?.db?.avgQueryMs || 0;
  const speed = 360*F, tubeTop = G.laneY - G.tubeH/2, tubeBot = G.laneY + G.tubeH/2;

  // backdrop grid
  ctx.fillStyle = 'rgba(124,156,255,.07)'; for(let x=18;x<w;x+=28) for(let y=14;y<h;y+=28) ctx.fillRect(x,y,1.2,1.2);

  // tube
  const tg = ctx.createLinearGradient(0,tubeTop,0,tubeBot); tg.addColorStop(0,'rgba(30,46,84,.55)'); tg.addColorStop(.5,'rgba(14,22,42,.6)'); tg.addColorStop(1,'rgba(30,46,84,.55)');
  ctx.fillStyle = tg; rr(ctx, G.x0-26, tubeTop, G.dbL-G.x0+26, G.tubeH, 18); ctx.fill(); ctx.strokeStyle = '#223152'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.save(); ctx.setLineDash([2,12]); ctx.lineDashOffset = -tsec*46*F; ctx.strokeStyle = 'rgba(124,156,255,.28)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(G.x0-10, G.laneY); ctx.lineTo(G.dbL, G.laneY); ctx.stroke(); ctx.restore();

  // return path
  ctx.save(); ctx.setLineDash([4,7]); ctx.strokeStyle = 'rgba(79,209,197,.25)'; ctx.lineWidth = 1.3; ctx.beginPath();

    ctx.fillStyle = P.ink; ctx.font = '600 12.5px Inter,system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(GATE[k], x, tubeTop-26);

  packets.forEach(p => {
    const y = G.laneY + p.lane;
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .38*p.a; ctx.drawImage(glow, p.x-p.side*1.15, y-p.side*1.15, p.side*2.3, p.side*2.3); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

let curRun = null; const live = {lps:0, rps:0, p95:null}; let last = {logs:0, reqs:0, t:performance.now()};
async function worker(run){
  const {mode, batch} = run.opts;
  while(!run.stop){
    const n = mode === 'single' ? 1 : batch, t = performance.now(); let res, level = 'info';
    try{
      if(mode === 'single'){ const l = genLog(); level = l.level; res = await fetch('/api/logs', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(l)}); }
      else res = await fetch('/api/logs/batch', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(Array.from({length:n}, genLog))});
      await res.arrayBuffer();
    }catch{ run.errors++; spawn('error', n, level); await sleep(80); continue; }
    const ms = performance.now() - t; run.reqs++;
    if(res.status === 201){ run.logs += n; run.lat.push(ms); if(run.lat.length > 3000) run.lat.shift(); spawn('ok', n, level); }
    else if(res.status === 429){ run.limited++; spawn('limited', n, level); await sleep(100); }
    else if(res.status === 503){ run.shed++; spawn('shed', n, level); await sleep(150); }
    else { run.errors++; spawn('error', n, level); }
  }
}
function startRun(opts, ms){
  stopRun();
  const run = {opts, logs:0, reqs:0, errors:0, limited:0, shed:0, lat:[], qs:[], stop:false, t0:performance.now(), vmax:{cpu:0,lag:0,busy:0,wait:0,max:0,q:0}};
  run.done = Promise.all(Array.from({length:opts.conc}, () => worker(run)));
  run.done.then(() => { if(curRun === run) curRun = null; });
  if(ms) setTimeout(() => run.stop = true, ms);
  curRun = run; last = {logs:0, reqs:0, t:performance.now()}; return run;
}
function stopRun(){ if(curRun) curRun.stop = true; }
function summarize(run){
  const secs = (performance.now() - run.t0)/1000, n = run.opts.mode === 'single' ? 1 : run.opts.batch;
  const avgQ = run.qs.length ? run.qs.reduce((a,b)=>a+b,0)/run.qs.length : null;
  return {lps:run.logs/secs, rps:run.reqs/secs, p50:pct(run.lat,.5), p95:pct(run.lat,.95), limited:run.limited, shed:run.shed, errors:run.errors, v:run.vmax, logs:run.logs, avgQ, perRow:avgQ == null ? null : avgQ/n};
}
const hist = []; let actUpdate = null;
setInterval(() => {
  const run = curRun, now = performance.now();
  if(run){
    const dt = (now-last.t)/1000; live.lps = (run.logs-last.logs)/dt; live.rps = (run.reqs-last.reqs)/dt; last = {logs:run.logs, reqs:run.reqs, t:now};
    live.p95 = pct(run.lat.slice(-200), .95);
    if(vit){ const v = run.vmax; v.cpu=Math.max(v.cpu,vit.cpuPct); v.lag=Math.max(v.lag,vit.loopLagP99Ms); v.busy=Math.max(v.busy,vit.pool.busy); v.wait=Math.max(v.wait,vit.pool.waiting); v.max=vit.pool.max; v.q=Math.max(v.q, vit.db.avgQueryMs);
      if(vit.db.samples > 0) run.qs.push(vit.db.avgQueryMs); }
  } else { live.lps = 0; live.rps = 0; }
  hist.push({lps:live.lps, p95:live.p95 ?? 0}); if(hist.length > 80) hist.shift();
  $('nLps').textContent = fmt(live.lps); $('nRps').textContent = fmt(live.rps);
  $('nP95').textContent = live.p95 == null ? '–' : live.p95.toFixed(0)+' ms'; $('nShed').textContent = vit?.requests.shed ?? 0;
  actUpdate?.();
}, 500);

async function api(method, path, body){
  const t0 = performance.now(); let res, data;
  try{ res = await fetch('/api'+path, {method, headers: body ? {'content-type':'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined}); data = await res.json().catch(()=>null); }
  catch(e){ res = {status:0}; data = {error:e.message}; }
  return {status:res.status, data, ms:performance.now()-t0};
}

// Act 4: index vs scan on a grid of "rows". Matches are drawn not-to-scale; timings are measured.
let race = null;
function drawRace(){
  const cv = $('a4c'); if(!cv) return; const {ctx,w,h} = fit(cv); const cols = 72, rows = 5, gx = 10, gw = w-20, cw = gw/cols, ch = 11;
  const lanes = [{y:30, name:'Full scan (no index)', col:P.bad}, {y:128, name:'Trigram index', col:P.teal}];
  const el = race ? Math.min(performance.now()-race.t0, race.T) : 0, tReal = race ? el/race.T*race.d.scan.ms : 0;
  lanes.forEach((L,li) => {
    ctx.fillStyle = P.ink; ctx.font = '600 12.5px Inter,system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.fillText(L.name, gx, L.y-10);
    const msNow = race ? (li === 0 ? Math.min(tReal, race.d.scan.ms) : Math.min(tReal, race.d.indexed.ms)) : 0;
    ctx.textAlign = 'right'; ctx.fillStyle = L.col; ctx.font = '700 14px ui-monospace,Consolas,monospace'; ctx.fillText(race ? msNow.toFixed(li === 0 ? 0 : 1)+' ms' : '– ms', w-gx, L.y-10);
    const sweep = race ? (tReal/race.d.scan.ms)*cols : 0, idxDone = race && tReal >= race.d.indexed.ms;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x = gx+c*cw, y = L.y+r*(ch+2), isM = race?.m.has(r*cols+c); let fill = '#0e1626';
      if(li === 0 && race){ if(c < sweep) fill = isM ? P.warn : '#22345c'; else if(c < sweep+1.2) fill = '#7c9cff'; }
      if(li === 1 && race && idxDone && isM) fill = P.teal;
      rr(ctx, x+.5, y, cw-2, ch, 2.5); ctx.fillStyle = fill; ctx.fill();
      if(fill === P.warn || fill === P.teal){ ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .5; ctx.drawImage(glow, x-8, y-8, cw+14, ch+16); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    }
    if(li === 1 && race && idxDone){ ctx.strokeStyle = 'rgba(79,209,197,.5)'; ctx.lineWidth = 1; race.m.forEach(i => { const r = Math.floor(i/cols), c = i%cols; ctx.beginPath(); ctx.moveTo(gx+14, L.y-4); ctx.lineTo(gx+c*cw+cw/2, L.y+r*(ch+2)); ctx.stroke(); }); }
  });

    </div>
    <div class="row" style="align-items:flex-end;gap:28px;margin-top:6px"><div><div class="big" id="a3x">–</div><div class="hint" id="a3xl">faster</div></div>
      <div><div class="stat" style="min-width:210px"><div class="v" id="a3row">–</div><div class="l">DB ms per row · was <span id="a3row0">${results.single ? perRowFmt(results.single.perRow) : '–'}</span></div></div></div></div>`;
    drawTrips(); if(results.single) $('a3s').style.width = '100%';
    $('a3run').onclick = async () => {
      $('a3run').disabled = true; const run = startRun({mode:'batch', batch:500, conc:6}, 5000); await run.done;
      const s = summarize(run); results.batch = s;
      const base = results.single?.lps, max = Math.max(s.lps, base || 0);
      $('a3bt').textContent = fmt(s.lps)+' logs/s'; $('a3b').style.width = (s.lps/max*100)+'%'; $('a3row').textContent = perRowFmt(s.perRow);
      if(base){ $('a3s').style.width = (base/max*100)+'%'; $('a3x').textContent = (s.lps/base).toFixed(1)+'×'; $('a3xl').textContent = 'more logs per second than one at a time'; }
      else $('a3xl').textContent = 'run Act 2 first for the comparison';
      $('a3run').disabled = false;
    };
    actUpdate = () => { if(curRun?.opts.mode === 'batch') $('a3bt').textContent = fmt(live.lps)+' logs/s'; };
  }
},
{
  kicker:'Act 4 · indexes', title:'Why search stays fast',
  text:`<p>Searching text inside millions of messages sounds slow, because a database normally reads every row to find matches.</p>
        <p>LogForge adds a <b>trigram GIN index</b>. It cuts text into 3-letter pieces and keeps a lookup table, so Postgres jumps straight to the candidate rows.</p>
        <p class="dim">The race runs the <i>same query</i> on the <i>same table</i> twice with <code>EXPLAIN ANALYZE</code>, inside a rolled-back transaction, so nothing changes.</p>`,
  mount(){ $('panel').innerHTML = `
    <div class="row"><div style="flex:1;min-width:200px"><input type="text" id="a4q" value="Webhook 99"></div><button class="btn go" id="a4run">▶ Race them</button></div>
    <p class="hint" id="a4meta" style="margin:10px 0">Pick a fairly specific phrase. Indexes shine when few rows match.</p>
    <canvas id="a4c" data-h="196"></canvas>
    <div class="row" style="align-items:baseline;margin-top:8px"><div class="big" id="a4x">–</div><span class="hint" id="a4plan"></span></div>`;
    race = null; drawRace();
    $('a4run').onclick = async () => {
      $('a4run').disabled = true; race = null; drawRace(); $('a4x').textContent = '–'; $('a4plan').textContent = '';
      $('a4meta').textContent = 'Running 4 query plans (2 warm-ups) on the whole table…';
      const r = await api('GET','/demo/explain?search='+encodeURIComponent($('a4q').value));
      $('a4run').disabled = false;
      if(r.status !== 200){ $('a4meta').textContent = r.data?.error || 'Failed'; return; }
      const d = r.data, m = new Set(); while(m.size < 7) m.add(rnd(72*5));
      $('a4meta').textContent = `${fmt(d.matches)} matching rows out of ${fmt(d.tableRows)}.`;
      race = {d, m, T:3600, t0:performance.now()}; drawRace();
      await sleep(race.T + 200);
      $('a4x').textContent = (d.scan.ms/d.indexed.ms).toFixed(0)+'×';
      $('a4plan').innerHTML = `Plans: <code>${esc(d.scan.nodes.at(-1))}</code> vs <code>${esc(d.indexed.nodes.at(-1))}</code>`;
    };
  }
},
{
  kicker:'Act 5 · limits', title:'How far can it go?',
  text:`<p>Every system has a ceiling. The honest way to find it is to add load in steps and see where throughput stops growing.</p>
        <p>This ramp goes from 1 to 6 connections and watches the server's own gauges (CPU, event-loop lag, DB gate) to name <b>what ran out first</b>.</p>
        <p class="dim">Browsers cap at 6 connections per host, so this client is part of the ceiling. A tool like k6 would push further.</p>`,
  mount(){ $('panel').innerHTML = `
    <div class="row"><button class="btn go" id="a5run">▶ Run the ramp (~15 s)</button><span class="hint" id="a5st"></span></div>
    <div id="a5rows" style="margin-top:14px"></div><div id="a5v" style="margin-top:10px"></div>`;
    $('a5run').onclick = async () => {
      $('a5run').disabled = true; $('a5rows').innerHTML = ''; $('a5v').innerHTML = ''; const rs = [];
      for(const c of [1,2,4,6]){
        $('a5st').textContent = `Stage: ${c} connection${c>1?'s':''} × 500 logs…`;
        const run = startRun({mode:'batch', batch:500, conc:c}, 3000); await run.done; rs.push({c, ...summarize(run)}); await sleep(400);
        const max = Math.max(...rs.map(r => r.lps));
        $('a5rows').innerHTML = rs.map(r => `<div class="bar" style="grid-template-columns:130px 1fr 240px"><span>${r.c} connection${r.c>1?'s':''}</span><div class="track"><div class="fill" style="width:${r.lps/max*100}%"></div></div><span>${fmt(r.lps)} logs/s · p95 ${r.p95?.toFixed(0)} ms</span></div>`).join('');
      }
      const peak = rs.reduce((a,b) => b.lps > a.lps ? b : a), v = peak.v; let why;
      if(rs.some(r => r.shed)) why = 'The server began shedding load: the DB queue passed its limit.';
      else if(v.busy >= v.max || v.wait > 0) why = `The DB gate saturated (${v.busy}/${v.max} busy, ${v.wait} queued): the connection limit is the bottleneck.`;
      else if(v.cpu > 85 || v.lag > 100) why = `The single Node process is CPU-bound (${v.cpu.toFixed(0)}% CPU, ${v.lag.toFixed(0)} ms loop lag). The fix is more processes behind a load balancer.`;
      else if(v.q > 15 && v.cpu < 70) why = `Postgres is the bottleneck: each insert statement takes about ${v.q.toFixed(0)} ms at peak while Node idles at ${v.cpu.toFixed(0)}% CPU. Writes get costlier as the table and its indexes grow, and the trigram index trades slower writes for fast search.`;
      else why = `Neither Node (${v.cpu.toFixed(0)}% CPU) nor the DB gate (${v.busy}/${v.max}) is saturated, so the ceiling is most likely Postgres write speed or this browser's 6-connection cap.`;
      $('a5v').innerHTML = `<div class="row" style="align-items:flex-end;gap:16px"><div class="big">${fmt(peak.lps)}</div><span class="hint" style="padding-bottom:6px">logs/s peak at ${peak.c} connections</span></div><p style="margin:10px 0 0"><b>Limiting factor:</b> ${why}</p>`;
      $('a5st').textContent = ''; $('a5run').disabled = false; stopRun();
    };
  }
},
{
  kicker:'Act 6 · failure', title:'Break it on purpose',
  text:`<p>Good systems are defined by how they fail. Start the flood, then sabotage the database while it runs.</p>
        <p>Shrink the <b>DB gate</b> or slow the database down and watch the amber queue build in front of it, and the blocks pile up in the pipe. When the queue passes its limit, <b>backpressure</b> answers <b>503</b> with <code>Retry-After</code>: red blocks shatter at the gate, latency stays bounded, and nothing crashes.</p>
        <p class="dim">Try: gate = 2, latency = 200 ms, queue limit = 3. Then press Heal.</p>`,
  async mount(){
    const cfg = (await api('GET','/demo/config')).data;
    if(!cfg || cfg.error){ $('panel').innerHTML = '<p class="hint">Demo controls are disabled on this server (ENABLE_DEMO=false).</p>'; return; }
    $('panel').innerHTML = `
    <div class="row"><button class="btn go" id="a6flood">🌊 Start flood</button><button class="btn" id="a6heal">Heal (reset)</button><span class="hint">flood = 6 connections × 200 logs, runs until stopped</span></div>
    <div style="margin-top:10px">
      <div class="ctl"><span>DB gate size</span><input type="range" id="c1" min="1" max="${cfg.poolCapacity}" value="${cfg.poolLimit}"><output id="o1"></output></div>
      <div class="ctl"><span>DB latency (simulated)</span><input type="range" id="c2" min="0" max="500" step="10" value="${cfg.dbLatencyMs}"><output id="o2"></output></div>
      <div class="ctl"><span>Queue limit before 503</span><input type="range" id="c3" min="0" max="50" value="${Math.min(cfg.queueMax,50)}"><output id="o3"></output></div>
    </div>
    <canvas id="a6c" data-h="110"></canvas><div class="legend" style="margin-top:6px"><span><i style="background:var(--teal)"></i>logs/s</span><span><i style="background:var(--bad)"></i>p95 latency</span></div>`;
    const lab = () => { $('o1').textContent = $('c1').value; $('o2').textContent = $('c2').value+' ms'; $('o3').textContent = $('c3').value; };
    const push = () => api('POST','/demo/config',{poolLimit:+$('c1').value, dbLatencyMs:+$('c2').value, queueMax:+$('c3').value});
    let dbn; ['c1','c2','c3'].forEach(id => $(id).oninput = () => { lab(); clearTimeout(dbn); dbn = setTimeout(push, 120); }); lab();
    const setBtn = (on) => { const b = $('a6flood'); b.textContent = on ? '■ Stop flood' : '🌊 Start flood'; b.classList.toggle('go', !on); b.classList.toggle('stop', on); };
    $('a6flood').onclick = () => { if(curRun){ stopRun(); setBtn(false); } else { startRun({mode:'batch', batch:200, conc:6}); setBtn(true); } };
    $('a6heal').onclick = async () => { stopRun(); const c = (await api('POST','/demo/reset')).data; $('c1').value = c.poolLimit; $('c2').value = c.dbLatencyMs; $('c3').value = c.queueMax; lab(); setBtn(false); };
    actUpdate = () => {
      const {ctx,w,h} = fit($('a6c')); if(hist.length < 2) return;
      const mx1 = Math.max(...hist.map(x=>x.lps),1), mx2 = Math.max(...hist.map(x=>x.p95),50), st = w/79;
      for(const [k,mx,col] of [['lps',mx1,P.teal],['p95',mx2,P.bad]]){
        ctx.beginPath(); hist.forEach((p,i) => { const x = w-(hist.length-1-i)*st, y = h-6-(p[k]/mx)*(h-14); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke(); }
      if(!curRun) setBtn(false);
    };
  },
  async leave(){ stopRun(); await api('POST','/demo/reset'); }
},
{
  kicker:'Act 7 · what I built', title:'The engineering decisions',
  text:`<p>A logging backend is simple to start and hard to make fast and safe. Each decision below is something you just watched working.</p>
        <p class="dim">Honest limits are listed too. Knowing what isn't done is part of the job.</p>`,
  mount(){ const card = (ic,b,t) => `<div class="mini"><div class="ic">${ic}</div><b>${b}</b><span>${t}</span></div>`; $('panel').innerHTML = `<div class="cards">
    ${card('▦','Batched ingest','One INSERT … unnest() per batch: one round trip for up to 1000 rows.')}
    ${card('⌕','Trigram GIN index','ILIKE search on millions of rows in milliseconds instead of a full scan.')}
    ${card('↧','Cursor pagination','Keyset on id: stable and fast at any depth, unlike OFFSET.')}
    ${card('≋','Live tail over SSE','Server coalesces bursts into 4 flushes/sec so a 20k logs/s flood cannot swamp browsers.')}
    ${card('⛶','Concurrency gate','A bulkhead in front of Postgres with an observable queue and a size that adapts.')}
    ${card('⛔','Load shedding','503 + Retry-After when the queue is full: bounded latency instead of collapse.')}
    ${card('⟲','Single-flight stats cache','Dashboard aggregates share one query per second, so reads do not fight writes.')}
    ${card('◎','Real observability','/api/metrics exposes event-loop lag, gate usage, per-query timings and outcome counts.')}
    ${card('☰','Layered modules','routes → controller → service → repository → db; validation and errors in one place.')}</div>
    <p class="hint" style="margin:18px 0 8px">Known limits and next steps</p>
    <div class="cards">${card('!','Not done yet','Auth / API keys per service, retention and partitioning, automated tests.')}
    ${card('⇉','Scaling out','Multiple Node processes need Redis pub/sub for the live tail, and a shared rate-limit store.')}</div>`; }
}
];

/* ================= navigation ================= */
let cur = -1; const seen = new Set();
$('dots').innerHTML = ACTS.map((_,i) => `<button title="Act ${i+1}" data-i="${i}"></button>`).join('');
$('dots').onclick = (e) => { const b = e.target.closest('button'); if(b) go(+b.dataset.i); };
async function go(i){
  i = Math.max(0, Math.min(ACTS.length-1, i)); if(i === cur) return;
  stopRun(); actUpdate = null; if(cur >= 0) await ACTS[cur].leave?.();
  cur = i; seen.add(i); const a = ACTS[i];
  $('kicker').textContent = a.kicker; $('title').textContent = a.title; $('text').innerHTML = a.text; $('narr').dataset.n = i+1;
  $('panel').innerHTML = ''; await a.mount();
  [$('narr'), $('panel')].forEach(el => { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); });
  [...$('dots').children].forEach((d,k) => { d.className = k === i ? 'on' : seen.has(k) ? 'seen' : ''; });
  $('prev').disabled = i === 0; $('next').disabled = i === ACTS.length-1;
  history.replaceState(null, '', '#act'+(i+1));
}
$('prev').onclick = () => go(cur-1); $('next').onclick = () => go(cur+1);
addEventListener('keydown', (e) => { if(e.target.matches('input')) return; if(e.key === 'ArrowRight') go(cur+1); if(e.key === 'ArrowLeft') go(cur-1); });
addEventListener('resize', () => { drawTrips(); drawRace(); });
addEventListener('beforeunload', () => { navigator.sendBeacon?.('/api/demo/reset'); });
requestAnimationFrame(frame);
go(Math.max(0, (parseInt(location.hash.replace('#act','')) || 1) - 1));
</script>
</body>
</html>
