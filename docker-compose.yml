# Dev-only Postgres for LogForge. Credentials are throwaway local values.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logforge
      POSTGRES_PASSWORD: logforge
      POSTGRES_DB: logforge
    ports:
      - "5440:5432"
    volumes:
      - logforge-data:/var/lib/postgresql/data

volumes:
  logforge-data:
